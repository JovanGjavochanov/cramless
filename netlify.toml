# Netlify build settings: every push to main is built and deployed.

[build]
  command = "npm run build"
  # @angular/build:application puts the static site in dist/<project>/browser
  publish = "dist/cramless/browser"

[build.environment]
  NODE_VERSION = "24"

# SPA fallback: the Angular router handles every path, so unknown URLs
# (deep links like /courses/3, or a refresh) must serve index.html instead of a 404.
# Real files (JS, CSS, favicon) are still served first, because this rule isn't forced.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
